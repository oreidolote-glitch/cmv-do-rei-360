name: Corrigir REPOR SETOR

on:

  push:

    branches:

      - main

    paths:

      - ".github/workflows/hotfix-repor-setor.yml"

permissions:

  contents: write

jobs:

  corrigir:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Corrigir REPOR SETOR

        run: |

          python - <<'PY'

          from pathlib import Path

          p = Path("index.html")

          s = p.read_text(encoding="utf-8")

          old = """    const situacao=total<=0?{c:'danger',t:'🔴 ZERADO TOTAL'}:local<=0&&central>0?{c:'warn',t:'🟡 REPOR SETOR'}:{c:'',t:'🟢 COM SALDO'};"""

          new = old + """

    const acaoSituacao=situacao.t.includes('REPOR SETOR')

      ? '<button type="button" class="pill '+situacao.c+'" data-id="'+esc(x.id)+'" onclick="reporSetorEstoque(this.dataset.id)" style="border:0;cursor:pointer;width:auto">'+situacao.t+'</button>'

      : '<div class="pill '+situacao.c+'">'+situacao.t+'</div>';"""

          if old not in s:

              raise SystemExit("REPOR SETOR não encontrado")

          s = s.replace(old, new, 1)

          oldpill = """<div class="pill '+situacao.c+'">'+situacao.t+'</div></div>';"""

          newpill = """'+acaoSituacao+'</div>';"""

          if oldpill not in s:

              raise SystemExit("Status não encontrado")

          s = s.replace(oldpill, newpill, 1)

          marker = "function crSetorTexto(s){"

          fn = r"""

let reposicaoSetorEmAndamento=false;

async function reporSetorEstoque(id){

  if(reposicaoSetorEmAndamento)return;

  const p=(estoqueCentralLista||[]).find(x=>String(x.id)===String(id));

  if(!p)return alert('Produto não encontrado.');

  const central=Number(p.estoque_central||0);

  const setor=String(p.setor||'').trim().toLowerCase();

  if(!setor)return alert('Produto sem setor definido.');

  if(central<=0)return alert('Sem saldo no estoque central.');

  const raw=prompt('Quantidade de '+p.nome+' para '+crSetorTexto(setor)+':','1');

  if(raw===null)return;

  const q=Number(String(raw).replace(',','.'));

  if(!Number.isFinite(q)||q<=0)

    return alert('Informe uma quantidade válida.');

  if(q>central)

    return alert('Quantidade maior que o estoque central.');

  if(!confirm('Confirmar transferência de '+q+' '+(p.unidade||'UN')+' de '+p.nome+' para '+crSetorTexto(setor)+'?'))

    return;

  reposicaoSetorEmAndamento=true;

  try{

    await json(await api('/rest/v1/rpc/transferir_estoque',{

      method:'POST',

      body:JSON.stringify({

        p_produto_id:p.id,

        p_quantidade:q,

        p_destino:setor,

        p_observacao:'Reposição pelo Estoque Central'

      })

    }));

    alert('Transferência concluída ✅');

    await Promise.all([

      loadEstoqueCentral(),

      loadProdutos(),

      loadDashboard()

    ]);

  }catch(e){

    alert(friendly(e));

  }finally{

    reposicaoSetorEmAndamento=false;

  }

}

"""

          if marker not in s:

              raise SystemExit("Ponto de inserção não encontrado")

          s = s.replace(marker, fn + "\n" + marker, 1)

          p.write_text(s, encoding="utf-8")

          PY

      - name: Salvar

        run: |

          git config user.name "CMV do Rei Bot"

          git config user.email "actions@users.noreply.github.com"

          git add index.html

          git commit -m "Corrige botão REPOR SETOR" || exit 0

          git push
